# Build, test and publish a release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One run per ref at a time; a second push of the same tag waits rather than racing the upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Build and test (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run tests
        run: docker build -f docker/Dockerfile --target native-out --output out .

  pi:
    name: Build and test (${{ matrix.name }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - model: pi-zero-2w
            name: Pi Zero 2 W
          - model: pi-4
            name: Pi 4
    steps:
      - uses: actions/checkout@v5
      - name: Cross build and run tests
        run: docker build -f docker/Dockerfile --target pi-out --build-arg PI_MODEL=${{ matrix.model }} --output out .
      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
          MODEL: ${{ matrix.model }}
        run: |
          # A branch name like feature/x (workflow_dispatch) would put a / in the file name.
          version=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
          tar -C out -czf "oap-headless-$version-$MODEL-arm64.tar.gz" oap-headless DEPENDENCIES.txt
          cp out/DEPENDENCIES.txt .
      # Both boards link the same libraries, so their DEPENDENCIES.txt are the same
      # and merge-multiple in the release job keeps one.
      - uses: actions/upload-artifact@v5
        with:
          name: pi-binaries-${{ matrix.model }}
          path: |
            oap-headless-*.tar.gz
            DEPENDENCIES.txt

  release:
    name: Publish release
    needs: [native, pi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A re-run finds the release already there: replace its files instead of failing.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber oap-headless-*.tar.gz DEPENDENCIES.txt
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes \
              oap-headless-*.tar.gz DEPENDENCIES.txt
          fi
